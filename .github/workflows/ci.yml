name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: no job needs to write to the repo.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (tag in the comment) so a moved tag can't change CI.
jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the tip
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commenting on PRs needs write access; the job stays read-only.
          GITLEAKS_ENABLE_COMMENTS: false

  lint-test:
    name: Lint and test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    # Scratch Postgres for tests/test_publish.py (the BI serving copy).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: analytics_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PIPELINE_TEST_POSTGRES_URL: postgresql://ci:ci@localhost:5432/analytics_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: pip install -c requirements.lock -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -rs  # -rs lists skipped tests, so a silently skipped publish test shows
      # dbt docs (model descriptions, tests, lineage graph) as a single self-contained HTML
      # file, built from a fixture run so the catalog has real tables.
      - name: Build dbt docs
        if: matrix.python == '3.12'
        env:
          PIPELINE_SOURCE_DIR: tests/fixtures
        run: |
          python -m pipeline run --month 2025-01
          PIPELINE_DATA_DIR="$PWD/data" PIPELINE_WAREHOUSE_PATH="$PWD/data/warehouse.duckdb" \
            dbt docs generate --static --project-dir dbt --profiles-dir dbt \
            --target-path "$PWD/data/dbt/target" --log-path "$PWD/data/dbt/logs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python == '3.12'
        with:
          name: dbt-docs
          path: data/dbt/target/static_index.html
          if-no-files-found: error

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t nyc-taxi-pipeline .
      # Runs the real image end to end on the committed fixture, offline.
      - name: Run pipeline on the fixture month
        run: |
          mkdir -p data && chmod 777 data  # container runs as a non-root user
          docker run --rm \
            -v "$PWD/data:/app/data" \
            -v "$PWD/tests/fixtures:/fixtures:ro" \
            -e PIPELINE_SOURCE_DIR=/fixtures \
            nyc-taxi-pipeline run --month 2025-01
          test -f data/warehouse.duckdb

  airflow:
    name: Airflow DAG test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Airflow image
        run: docker build -f docker/airflow.Dockerfile -t nyc-taxi-airflow .
      # Parses the DAG, then runs one full DAG run (sensor -> extract -> validate -> dbt ->
      # log) on the fixture month with SQLite metadata, and checks what it wrote.
      - name: Run the DAG on the fixture month
        run: |
          mkdir -p data && chmod 777 data
          docker run --rm \
            -v "$PWD/data:/opt/airflow/data" \
            -v "$PWD/tests/fixtures:/fixtures:ro" \
            -e PIPELINE_SOURCE_DIR=/fixtures \
            -e PIPELINE_TASK_RETRIES=0 \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=false \
            nyc-taxi-airflow bash -euo pipefail -c '
              airflow db migrate > /dev/null
              airflow pools set nyc_taxi_pipeline 1 "DuckDB single writer" > /dev/null
              airflow dags list-import-errors | tee /tmp/import-errors
              grep -q "No data found" /tmp/import-errors
              airflow dags test nyc_taxi_monthly 2025-01-01 | tee /tmp/dag-test.log
              grep -q "state=success" /tmp/dag-test.log
              python -c "
          import duckdb
          con = duckdb.connect(\"/opt/airflow/data/warehouse.duckdb\", read_only=True)
          status, rows_clean = con.execute(\"SELECT status, rows_clean FROM run_log\").fetchone()
          fact = con.execute(\"SELECT count(*) FROM fact_trips\").fetchone()[0]
          assert status == \"success\" and fact == rows_clean > 0, (status, rows_clean, fact)
          print(f\"run_log: {status}, fact_trips: {fact} rows\")
          "
            '
