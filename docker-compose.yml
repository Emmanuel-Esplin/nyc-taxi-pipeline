# The whole stack, locally:
#   Airflow   api-server, scheduler and dag-processor (LocalExecutor) on http://localhost:8080
#   Postgres  Airflow's metadata DB, plus `analytics` (BI serving copy of the marts) and
#             `metabase` (Metabase's own DB), created by postgres-setup
#   Metabase  dashboards on `analytics` at http://localhost:3000
# `make up` starts everything, `make airflow-up` / `make bi-up` start one side.
# Pipeline outputs land in ./data, shared with the CLI and Docker runs.
#
# Every password and secret comes from .env, which git ignores and `make secrets` generates
# with random values. Compose refuses to start if one is missing; none are in this repo.

x-serving-passwords: &serving-passwords
  ANALYTICS_WRITER_PASSWORD: ${ANALYTICS_WRITER_PASSWORD:?set ANALYTICS_WRITER_PASSWORD in .env - run make secrets}
  METABASE_READER_PASSWORD: ${METABASE_READER_PASSWORD:?set METABASE_READER_PASSWORD in .env - run make secrets}
  METABASE_APP_DB_PASSWORD: ${METABASE_APP_DB_PASSWORD:?set METABASE_APP_DB_PASSWORD in .env - run make secrets}

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  image: nyc-taxi-airflow:latest
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - run make secrets}@postgres/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # New DAGs start paused, so `up` never starts a backfill (and its downloads) by surprise.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Local development only: every UI user is an admin and no login is needed.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # Signs task tokens; all Airflow services must share it.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env - run make secrets}
    PIPELINE_START_MONTH: ${PIPELINE_START_MONTH:-2025-01}
    PIPELINE_END_MONTH: ${PIPELINE_END_MONTH:-}
    PIPELINE_SOURCE_DIR: ${PIPELINE_SOURCE_DIR:-}
    # The DAG's publish_marts task copies the marts here for Metabase.
    PIPELINE_SERVING_URL: postgresql://analytics_writer:${ANALYTICS_WRITER_PASSWORD:?set ANALYTICS_WRITER_PASSWORD in .env - run make secrets}@postgres:5432/analytics
  volumes:
    - ./data:/opt/airflow/data
    - ./airflow/dags:/opt/airflow/dags  # live-edit DAGs without rebuilding the image
  depends_on:
    postgres:
      condition: service_healthy
    postgres-setup:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: airflow
      # Superuser of the metadata DB; also used by postgres-setup.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - run make secrets}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"  # localhost only: lets `make publish` run from the host
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  postgres-setup:
    image: postgres:17
    entrypoint: ["/setup-serving.sh"]
    environment:
      <<: *serving-passwords
      PGHOST: postgres
      PGUSER: airflow
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - run make secrets}
    volumes:
      - ./docker/postgres/setup-serving.sh:/setup-serving.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  metabase:
    image: metabase/metabase:v0.64.5
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase_app
      MB_DB_PASS: ${METABASE_APP_DB_PASSWORD:?set METABASE_APP_DB_PASSWORD in .env - run make secrets}
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      JAVA_OPTS: -Xmx1g
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/api/health"]
      interval: 10s
      retries: 30
      start_period: 60s
    depends_on:
      postgres-setup:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    # Migrate the metadata DB and create the one-slot pool that serialises data tasks.
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow pools set nyc_taxi_pipeline 1 "One data task at a time: DuckDB single writer"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db:
