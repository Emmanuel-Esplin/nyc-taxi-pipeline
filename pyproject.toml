[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi-pipeline"
version = "0.3.0"
description = "Batch pipeline: NYC TLC Yellow Taxi trips -> validated staging -> DuckDB star schema"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1,<2",  # 2.0.0 returns wrong results after in-transaction bulk inserts
    "dbt-duckdb>=1.11,<1.12",
    "pyyaml>=6",
]

[project.optional-dependencies]
# pandas/pyarrow are only used to build the hand-made DataFrames in the unit tests.
dev = ["pytest>=8", "ruff>=0.6", "pandas>=2.2,<3", "pyarrow>=16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pipeline = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004"]
